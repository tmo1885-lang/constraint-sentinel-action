name: CS-GAP-02 offline pytest research

on:
  pull_request:
    paths:
      - "experiments/cs_gap02/**"
      - ".github/workflows/cs-gap02-experiment.yml"

permissions:
  contents: read

jobs:
  synthetic-pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test-only pytest dependency
        run: python -m pip install --disable-pip-version-check "pytest==9.0.2"
      - name: Run disposable Git/pytest reachability controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m unittest discover -s experiments/cs_gap02 -p test_gap02_experiment.py -v

# Research fixture only: candidate test execution is NOT an OS sandbox.
# Never switch this to pull_request_target or grant write permissions.
