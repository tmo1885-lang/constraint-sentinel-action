name: CS-ADDON-01 AQG companion (synthetic, warn-only)

on:
  pull_request:
    paths:
      - "experiments/cs_addon01/**"
      - ".github/workflows/cs-addon01-companion.yml"

permissions:
  contents: read

jobs:
  synthetic-companion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned research-only pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.0.2"
      - name: Fetch exact public AQG verifier outside candidate
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= clone --quiet --no-tags https://github.com/deeppatternai/agent-quality-gates.git "$RUNNER_TEMP/aqg-source"
          git -C "$RUNNER_TEMP/aqg-source" checkout --quiet d3e7e466d784f25e5ccf9488a8749bd6c9851743
          test "$(git -C "$RUNNER_TEMP/aqg-source" rev-parse HEAD)" = "d3e7e466d784f25e5ccf9488a8749bd6c9851743"
      - name: Validate warn-only adapter semantics
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s experiments/cs_addon01 -p test_adapter.py -v
      - name: Run four disposable AQG vs fixed-ID vs R2 cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          set -euo pipefail
          python experiments/cs_addon01/run_trial.py \
            --aqg-root "$RUNNER_TEMP/aqg-source" \
            --workdir "$RUNNER_TEMP/cs-addon01-fixtures" \
            --output "$RUNNER_TEMP/cs-addon01-comparison.json"

# Research fixture only. All candidate tests are synthetic and unprivileged.
# The SUCCESS of this job means the expected classifications matched.
# A candidate-specific FAIL or UNVERIFIED is advisory, NOT an enforced merge gate.
# Never change this workflow to pull_request_target or pass secrets to test execution.
