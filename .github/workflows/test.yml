name: Validate experimental release candidate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    # Cover Linux versions and Windows Git checkout behavior in hosted CI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the actual beta Python package
        run: python -m pip install . --no-deps
      - name: Confirm installed CLI version matches package metadata
        run: python -c "import importlib.metadata as m, subprocess; expected=m.version('constraint-sentinel'); actual=subprocess.check_output(['constraint-sentinel', '--version'], text=True).strip(); assert actual == expected, f'{actual} != {expected}'"
      - name: Core Git and contract regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q

  release-action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create disposable repo with approved contract
        id: fixture
        run: |
          SHA=$(python3 scripts/make_smoke_fixture.py "$RUNNER_TEMP/sentinel-beta-fixture")
          echo "base=$SHA" >> "$GITHUB_OUTPUT"
      - name: Accept authorized source change with required check
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-beta-fixture
          base: ${{ steps.fixture.outputs.base }}
          run-checks: "true"
          audit-ignored-protected: "true"
      - name: Add unauthorized payment change
        run: |
          printf "gateway = forbidden\n" > "$RUNNER_TEMP/sentinel-beta-fixture/src/payments/gateway.py"
      - name: Plant a harmless shadow module in the Action working directory
        run: |
          printf 'from pathlib import Path\nPath("shadow-executed").touch()\n' > constraint_sentinel.py
      - name: Reject unauthorized payment change
        id: expected_payment_fail
        continue-on-error: true
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-beta-fixture
          base: ${{ steps.fixture.outputs.base }}
          run-checks: "true"
          audit-ignored-protected: "true"
      - name: Assert payment edit was rejected
        env:
          RESULT: ${{ steps.expected_payment_fail.outcome }}
        run: |
          test "$RESULT" = failure
          test ! -e shadow-executed
          rm constraint_sentinel.py
      - name: Restore gateway then delete required test file
        run: |
          git -C "$RUNNER_TEMP/sentinel-beta-fixture" restore -- src/payments/gateway.py
          rm "$RUNNER_TEMP/sentinel-beta-fixture/tests/test_cart.py"
      - name: Reject test deletion
        id: expected_delete_fail
        continue-on-error: true
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-beta-fixture
          base: ${{ steps.fixture.outputs.base }}
          run-checks: "true"
          audit-ignored-protected: "true"
      - name: Assert test deletion was rejected
        env:
          RESULT: ${{ steps.expected_delete_fail.outcome }}
        run: test "$RESULT" = failure
      - name: Restore test then add ignored protected file
        run: |
          git -C "$RUNNER_TEMP/sentinel-beta-fixture" restore -- tests/test_cart.py
          printf "synthetic fixture\n" > "$RUNNER_TEMP/sentinel-beta-fixture/src/payments/ignored-fixture.txt"
      - name: Reject Git-ignored protected file
        id: expected_ignored_fail
        continue-on-error: true
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-beta-fixture
          base: ${{ steps.fixture.outputs.base }}
          run-checks: "true"
          audit-ignored-protected: "true"
      - name: Assert ignored-file rejection
        env:
          RESULT: ${{ steps.expected_ignored_fail.outcome }}
        run: test "$RESULT" = failure

      - name: Prepare owner-ledger task fixture
        id: task_fixture
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/make_task_scope_fixture.py "$RUNNER_TEMP/sentinel-task-fixture" >> "$GITHUB_OUTPUT"
      - name: Accept approved task change with external approval checkout
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-task-fixture/candidate
          approval-repo-path: ${{ runner.temp }}/sentinel-task-fixture/trusted-approvals
          task-branch: task/smoke-cart
          expected-base-branch: main
          base: ${{ steps.task_fixture.outputs.base }}
          head: ${{ steps.task_fixture.outputs.head }}
      - name: Commit unapproved payment change in fixture
        run: |
          printf "SAFE = False\n" > "$RUNNER_TEMP/sentinel-task-fixture/candidate/payments.py"
          git -C "$RUNNER_TEMP/sentinel-task-fixture/candidate" add payments.py
          git -C "$RUNNER_TEMP/sentinel-task-fixture/candidate" \
            -c user.name=SentinelSmoke -c user.email=smoke@example.invalid \
            commit -qm "Synthetic unapproved payment edit"
      - name: Reject unapproved task change with external approval checkout
        id: expected_task_fail
        continue-on-error: true
        uses: ./
        with:
          repository-path: ${{ runner.temp }}/sentinel-task-fixture/candidate
          approval-repo-path: ${{ runner.temp }}/sentinel-task-fixture/trusted-approvals
          task-branch: task/smoke-cart
          expected-base-branch: main
          base: ${{ steps.task_fixture.outputs.base }}
          head: HEAD
      - name: Assert task-specific violation failed
        env:
          RESULT: ${{ steps.expected_task_fail.outcome }}
        run: test "$RESULT" = failure

# The workflow only tests synthetic Git repositories. It does not certify
# resistance to adversarial agents or external side effects.
